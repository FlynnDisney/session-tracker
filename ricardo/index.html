<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ricardo Morais — Session Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1117;
    --surface: #181A22;
    --surface-2: #1E2029;
    --surface-3: #262833;
    --border: #2A2D3A;
    --text: #E8E9ED;
    --text-2: #9498A8;
    --text-3: #5D6175;
    --accent: #6C8EEF;
    --accent-glow: rgba(108, 142, 239, 0.15);
    --emotion: #E8845C;
    --emotion-glow: rgba(232, 132, 92, 0.12);
    --strength: #5CCFB5;
    --strength-glow: rgba(92, 207, 181, 0.12);
    --bounce: #C9A0FF;
    --bounce-glow: rgba(201, 160, 255, 0.12);
    --danger: #EF6C6C;
    --radius: 12px;
    --radius-sm: 8px;
    --font-display: 'Fraunces', serif;
    --font-body: 'DM Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 520px;
    margin: 0 auto;
    padding: 0 16px 100px;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── Header ── */
  .header {
    padding: 24px 0 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .client-badge {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-glow);
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.02em;
  }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 12px 0;
    overflow-x: auto;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-2);
    transition: all 0.2s ease;
  }
  .tab:hover { border-color: var(--text-3); color: var(--text); }
  .tab.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  /* ── Section Labels ── */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-3);
    padding: 20px 0 8px;
  }
  .section-label.emotion { color: var(--emotion); }
  .section-label.strength { color: var(--strength); }
  .section-label.bounce { color: var(--bounce); }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 8px;
  }

  /* ── Exercise Block ── */
  .exercise-block { margin-bottom: 4px; }
  .exercise-block:last-child { margin-bottom: 0; }
  .exercise-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 6px;
  }
  .exercise-letter {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    color: var(--strength);
    background: var(--strength-glow);
    width: 26px;
    height: 26px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .exercise-letter.bounce-letter {
    color: var(--bounce);
    background: var(--bounce-glow);
  }
  .exercise-info { flex: 1; }
  .exercise-name {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
  }
  .exercise-rx {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 2px;
    line-height: 1.4;
  }
  .exercise-variants {
    margin: 6px 0 4px 36px;
    list-style: none;
  }
  .exercise-variants li {
    font-size: 12px;
    color: var(--text-2);
    padding: 2px 0;
    position: relative;
    padding-left: 12px;
  }
  .exercise-variants li::before {
    content: '·';
    position: absolute;
    left: 0;
    color: var(--text-3);
    font-weight: 700;
  }

  /* ── Input Row ── */
  .input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: 36px;
    margin-top: 6px;
  }
  .input-row + .input-row {
    margin-top: 4px;
  }
  .input-group {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
  }
  .input-label {
    font-size: 11px;
    color: var(--text-3);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .num-field {
    width: 56px;
    padding: 6px 6px;
    text-align: center;
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    color: var(--strength);
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color 0.2s;
  }
  .num-field:focus { border-color: var(--strength); }
  .num-field.bounce-field { color: var(--bounce); }
  .num-field.bounce-field:focus { border-color: var(--bounce); }
  .input-unit {
    font-size: 11px;
    color: var(--text-3);
  }

  /* ── Superset Badge ── */
  .superset-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-glow);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* ── Divider inside card ── */
  .card-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 14px 0;
  }

  /* ── Emotion Slider Row ── */
  .metric-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
  }
  .metric-row + .metric-row { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 6px; }
  .metric-name {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
  }
  .metric-name-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .metric-name-wrap .metric-name {
    flex: none;
  }
  .metric-desc {
    font-size: 11px;
    color: var(--text-3);
    line-height: 1.3;
  }
  .metric-value {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 700;
    width: 28px;
    text-align: right;
    margin-left: 12px;
  }
  .metric-value.emotion-val { color: var(--emotion); }
  .slider-wrap { flex: 1.2; margin: 0 12px; }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: var(--surface-3);
    outline: none;
    cursor: pointer;
  }
  input[type="range"].emotion-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--emotion);
    box-shadow: 0 0 8px rgba(232, 132, 92, 0.4);
    cursor: grab;
  }
  input[type="range"].emotion-slider::-moz-range-thumb {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--emotion);
    border: none;
    box-shadow: 0 0 8px rgba(232, 132, 92, 0.4);
    cursor: grab;
  }

  /* ── Notes ── */
  .notes-field {
    width: 100%;
    min-height: 60px;
    padding: 12px;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text);
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    outline: none;
    resize: vertical;
    transition: border-color 0.2s;
  }
  .notes-field:focus { border-color: var(--accent); }
  .notes-field::placeholder { color: var(--text-3); }

  /* ── Submit ── */
  .submit-btn {
    width: 100%;
    padding: 14px;
    margin-top: 16px;
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 700;
    color: var(--bg);
    background: linear-gradient(135deg, var(--accent), #8BA4F0);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(108, 142, 239, 0.3); }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

  /* ── Graph ── */
  .graph-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 4px;
  }
  .graph-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .graph-title { font-size: 14px; font-weight: 600; }
  .graph-legend { display: flex; gap: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-2); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .graph-canvas-wrap { position: relative; height: 180px; }
  canvas { width: 100% !important; height: 100% !important; }

  .graph-toggle {
    display: flex;
    gap: 4px;
    background: var(--surface-3);
    border-radius: 16px;
    padding: 2px;
  }
  .graph-toggle button {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    background: transparent;
    color: var(--text-3);
    transition: all 0.2s;
  }
  .graph-toggle button.active { background: var(--text); color: var(--bg); }

  .empty-graph {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 180px;
    color: var(--text-3);
    font-size: 13px;
  }

  .date-field {
    padding: 8px 12px;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text);
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    outline: none;
    color-scheme: dark;
  }
  .date-field:focus { border-color: var(--accent); }

  /* ── Diary ── */
  .diary-entry {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 8px;
  }
  .diary-date {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .diary-session-badge {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-glow);
    padding: 2px 8px;
    border-radius: 12px;
  }
  .diary-exercise {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 4px 0;
    font-size: 13px;
  }
  .diary-exercise + .diary-exercise {
    border-top: 1px solid var(--border);
    padding-top: 6px;
    margin-top: 2px;
  }
  .diary-ex-name {
    color: var(--text-2);
    flex: 1;
  }
  .diary-ex-data {
    color: var(--text);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    text-align: right;
    white-space: nowrap;
  }
  .diary-emotions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .diary-emotion-chip {
    font-size: 11px;
    color: var(--emotion);
    background: var(--emotion-glow);
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  .diary-notes {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-style: italic;
    line-height: 1.4;
  }
  .diary-empty {
    text-align: center;
    color: var(--text-3);
    font-size: 13px;
    padding: 24px 0;
  }

  /* ── Status Bar ── */
  .status-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    z-index: 100;
  }
  .status-bar.show { transform: translateY(0); }
  .status-bar.success { background: #1a3a2a; color: #5CCFB5; }
  .status-bar.error { background: #3a1a1a; color: #EF6C6C; }
  .status-bar.loading { background: #1a2a3a; color: var(--accent); }

  .admin-toggle {
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    font-family: var(--font-body);
    transition: all 0.2s;
  }
  .admin-toggle:hover { border-color: var(--text-3); }
  .admin-toggle.active { background: var(--accent-glow); color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>

<div class="app" id="app"></div>
<div class="status-bar" id="status"></div>

<script>
// ════════════════════════════════════════════════════════════════
// CONFIGURATION — Ricardo Morais
// ════════════════════════════════════════════════════════════════

const CONFIG = {
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwF3fDaNPB6nm9erj5FOHV3tgK1PklRzeqBVPgimmM5YMNSioYCM9p2dPf3Jw8C5fDc3A/exec',

  CLIENT_NAME: 'Ricardo Morais',

  SESSIONS: ['Lower Body', 'Upper Body'],

  EMOTIONS: [
    { name: 'Excitement', desc: 'Your energy level going into the session' },
    { name: 'Pride', desc: 'Your satisfaction after the session' },
    { name: 'Serenity', desc: 'How present you felt during the session' },
  ],

  // Per-session exercise programs
  PROGRAMS: {
    'Lower Body': {
      bounces: {
        letter: 'A',
        name: 'Bounces',
        rx: '10–15 min · ~100–150 ground contacts',
        variants: ['Free Skips', 'Line Jumps', 'Crossed-Extensor Hops'],
        track: [
          { id: 'lb_bounce_mins', label: 'Duration', unit: 'min' },
          { id: 'lb_bounce_contacts', label: 'Contacts', unit: '' },
        ],
      },
      exercises: [
        {
          letter: 'B',
          name: 'Zercher Heel Elevated Squats',
          rx: '2 sets · 6–10 reps · 3 min rest · 60–70 kg',
          track: [
            { id: 'lb_zhes_load_s1', label: 'S1 load', unit: 'kg' },
            { id: 'lb_zhes_reps_s1', label: 'S1 reps', unit: '' },
            { id: 'lb_zhes_load_s2', label: 'S2 load', unit: 'kg' },
            { id: 'lb_zhes_reps_s2', label: 'S2 reps', unit: '' },
          ],
        },
        {
          letter: 'C',
          name: 'Zercher Romanian Deadlift',
          rx: '2 sets · 6–10 reps · 3 min rest · 50–60 kg',
          track: [
            { id: 'lb_zrdl_load_s1', label: 'S1 load', unit: 'kg' },
            { id: 'lb_zrdl_reps_s1', label: 'S1 reps', unit: '' },
            { id: 'lb_zrdl_load_s2', label: 'S2 load', unit: 'kg' },
            { id: 'lb_zrdl_reps_s2', label: 'S2 reps', unit: '' },
          ],
        },
        {
          letter: 'D',
          name: 'Landmine Deadlift',
          rx: '1 set · 8+ reps to failure · 3 min rest · 15–25 kg',
          track: [
            { id: 'lb_lmdl_load', label: 'Load', unit: 'kg' },
            { id: 'lb_lmdl_reps', label: 'Reps', unit: '' },
          ],
        },
        {
          letter: 'E',
          name: 'Zercher Horse Stance Isometric',
          rx: '2 sets · 30–45 sec · 2–3 min rest · 30–40 kg',
          track: [
            { id: 'lb_zhsi_load_s1', label: 'S1 load', unit: 'kg' },
            { id: 'lb_zhsi_sec_s1', label: 'S1 sec', unit: 's' },
            { id: 'lb_zhsi_load_s2', label: 'S2 load', unit: 'kg' },
            { id: 'lb_zhsi_sec_s2', label: 'S2 sec', unit: 's' },
          ],
        },
      ],
    },

    'Upper Body': {
      bounces: {
        letter: 'A',
        name: 'Bounces',
        rx: '10–15 min · ~50–70 pull & push contacts',
        variants: [
          'Pull — Row Bounce, Switch Grip, Pull Up Bounce',
          'Push — Push Up Bounce, Wide to Narrow, Lean Bounce',
        ],
        track: [
          { id: 'ub_bounce_mins', label: 'Duration', unit: 'min' },
          { id: 'ub_bounce_contacts', label: 'Contacts', unit: '' },
        ],
      },
      exercises: [
        {
          letter: 'B',
          name: 'Garhammer Raise on Incline Bench',
          rx: '1 set · 8+ reps to failure',
          badge: 'Abs',
          track: [
            { id: 'ub_ghr_reps', label: 'Reps', unit: '' },
          ],
        },
        {
          letter: 'C',
          name: 'Overhead Press',
          rx: '2 sets · 8–10 reps · 3 min rest · 40–45 kg',
          badge: 'Superset',
          track: [
            { id: 'ub_ohp_load_s1', label: 'S1 load', unit: 'kg' },
            { id: 'ub_ohp_reps_s1', label: 'S1 reps', unit: '' },
            { id: 'ub_ohp_load_s2', label: 'S2 load', unit: 'kg' },
            { id: 'ub_ohp_reps_s2', label: 'S2 reps', unit: '' },
          ],
        },
        {
          letter: 'C',
          name: 'Weighted Pull Up, Top Pause',
          rx: '2 sets · 8–10 reps · 3 min rest · 15–20 kg',
          badge: 'Superset',
          track: [
            { id: 'ub_wpu_load_s1', label: 'S1 load', unit: 'kg' },
            { id: 'ub_wpu_reps_s1', label: 'S1 reps', unit: '' },
            { id: 'ub_wpu_load_s2', label: 'S2 load', unit: 'kg' },
            { id: 'ub_wpu_reps_s2', label: 'S2 reps', unit: '' },
          ],
        },
        {
          letter: 'D',
          name: 'Ring Push Up',
          rx: '1–2 sets · 8–10 reps · 3 min rest · 15–20 kg',
          badge: 'Superset',
          track: [
            { id: 'ub_rpu_load_s1', label: 'S1 load', unit: 'kg' },
            { id: 'ub_rpu_reps_s1', label: 'S1 reps', unit: '' },
            { id: 'ub_rpu_load_s2', label: 'S2 load', unit: 'kg' },
            { id: 'ub_rpu_reps_s2', label: 'S2 reps', unit: '' },
          ],
        },
        {
          letter: 'D',
          name: 'Yates Row',
          rx: '1–2 sets · 8–10 reps · 3 min rest · 35–45 kg',
          badge: 'Superset',
          track: [
            { id: 'ub_yr_load_s1', label: 'S1 load', unit: 'kg' },
            { id: 'ub_yr_reps_s1', label: 'S1 reps', unit: '' },
            { id: 'ub_yr_load_s2', label: 'S2 load', unit: 'kg' },
            { id: 'ub_yr_reps_s2', label: 'S2 reps', unit: '' },
          ],
        },
      ],
    },
  },
};

// ════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════

function currentProgram() {
  return CONFIG.PROGRAMS[CONFIG.SESSIONS[state.activeTab]];
}

function chunkPairs(arr) {
  const chunks = [];
  for (let i = 0; i < arr.length; i += 2) {
    chunks.push(arr.slice(i, i + 2));
  }
  return chunks;
}

function allTrackIds() {
  const prog = currentProgram();
  let ids = [];
  if (prog.bounces) ids.push(...prog.bounces.track.map(t => t.id));
  prog.exercises.forEach(ex => ids.push(...ex.track.map(t => t.id)));
  return ids;
}

// Collect all trackable IDs across ALL sessions (for graph)
function allTrackIdsForSession(sessionName) {
  const prog = CONFIG.PROGRAMS[sessionName];
  if (!prog) return [];
  let ids = [];
  if (prog.bounces) ids.push(...prog.bounces.track.map(t => t.id));
  prog.exercises.forEach(ex => ids.push(...ex.track.map(t => t.id)));
  return ids;
}

function getFieldLabel(fieldId, sessionName) {
  const prog = CONFIG.PROGRAMS[sessionName];
  if (!prog) return null;
  if (prog.bounces) {
    for (const t of prog.bounces.track) {
      if (t.id === fieldId) return { exercise: prog.bounces.name, label: t.label, unit: t.unit };
    }
  }
  for (const ex of prog.exercises) {
    for (const t of ex.track) {
      if (t.id === fieldId) return { exercise: ex.name, label: t.label, unit: t.unit };
    }
  }
  return null;
}

function renderDiaryEntry(entry) {
  const sessionName = entry.session;
  const prog = CONFIG.PROGRAMS[sessionName];
  if (!prog) return '';

  const fmtDate = (d) => {
    try { return new Date(d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
    catch { return d; }
  };

  const exerciseData = {};
  const allExercises = [];
  if (prog.bounces) allExercises.push({ name: prog.bounces.name, fields: prog.bounces.track });
  prog.exercises.forEach(ex => allExercises.push({ name: ex.name, fields: ex.track }));

  allExercises.forEach(ex => {
    const values = [];
    ex.fields.forEach(t => {
      const val = entry.strength ? entry.strength[t.id] : '';
      if (val !== '' && val !== undefined && val !== null) {
        values.push(t.label + ': ' + val + (t.unit ? ' ' + t.unit : ''));
      }
    });
    if (values.length > 0) {
      exerciseData[ex.name] = values.join(' · ');
    }
  });

  const exerciseNames = Object.keys(exerciseData);
  if (exerciseNames.length === 0 && !entry.notes) return '';

  const emotionChips = CONFIG.EMOTIONS
    .filter(e => entry.emotions && entry.emotions[e.name] && entry.emotions[e.name] !== '')
    .map(e => `<span class="diary-emotion-chip">${e.name} ${entry.emotions[e.name]}/5</span>`)
    .join('');

  return `
    <div class="diary-entry">
      <div class="diary-date">
        <span>${fmtDate(entry.date)}</span>
        <span class="diary-session-badge">${sessionName}</span>
      </div>
      ${exerciseNames.map(name => `
        <div class="diary-exercise">
          <span class="diary-ex-name">${name}</span>
          <span class="diary-ex-data">${exerciseData[name]}</span>
        </div>
      `).join('')}
      ${emotionChips ? `<div class="diary-emotions">${emotionChips}</div>` : ''}
      ${entry.notes ? `<div class="diary-notes">${entry.notes}</div>` : ''}
    </div>
  `;
}

function getLoadMetrics(sessionName) {
  const prog = CONFIG.PROGRAMS[sessionName];
  if (!prog) return [];
  let loads = [];
  prog.exercises.forEach(ex => {
    const loadField = ex.track.find(t => t.label === 'S1 load');
    if (loadField) loads.push({ id: loadField.id, name: ex.name });
  });
  return loads;
}

// ════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════

const TABS = [...CONFIG.SESSIONS, 'Diary'];

const state = {
  scriptUrl: CONFIG.SCRIPT_URL,
  activeTab: 0,
  emotions: CONFIG.EMOTIONS.reduce((o, e) => ({ ...o, [e.name]: 3 }), {}),
  tracking: {},
  notes: '',
  history: [],
  allHistory: [],
  graphMode: 'emotions',
  submitting: false,
  isAdmin: new URLSearchParams(window.location.search).get('admin') === 'true',
};

// ════════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════════

function isDiary() {
  return TABS[state.activeTab] === 'Diary';
}

function render() {
  const app = document.getElementById('app');
  const diary = isDiary();
  const prog = diary ? null : currentProgram();

  app.innerHTML = `
    <div class="header">
      <h1>Session Tracker</h1>
      <span class="client-badge">${CONFIG.CLIENT_NAME}</span>
    </div>

    <div class="tabs" role="tablist">
      ${TABS.map((s, i) => `
        <button class="tab ${i === state.activeTab ? 'active' : ''}" 
                onclick="setTab(${i})" role="tab">${s}</button>
      `).join('')}
    </div>

    ${diary ? renderDiaryView() : renderSessionForm(prog)}

    ${state.isAdmin ? `
      <div class="section-label" style="color: var(--text-3); margin-top: 12px;">Admin</div>
      <div class="card" style="font-size: 13px; color: var(--text-2);">
        <p style="margin-bottom: 4px;">Connected to Google Sheet ✓</p>
        <p>Entries: ${diary ? state.allHistory.length : state.history.length} · Tab: ${TABS[state.activeTab]}</p>
      </div>
    ` : ''}
  `;

  if (!diary && state.history.length >= 2) {
    requestAnimationFrame(drawChart);
  }
  if (!diary) renderLegend();
}

function renderSessionForm(prog) {
  return `
    <div style="padding: 8px 0; font-size: 13px; color: var(--text-2);">
      ${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
    </div>

    ${prog.bounces ? `
      <div class="section-label bounce">Bounces</div>
      <div class="card">
        <div class="exercise-block">
          <div class="exercise-header">
            <div class="exercise-letter bounce-letter">${prog.bounces.letter}</div>
            <div class="exercise-info">
              <div class="exercise-name">${prog.bounces.name}</div>
              <div class="exercise-rx">${prog.bounces.rx}</div>
            </div>
          </div>
          ${prog.bounces.variants ? `
            <ul class="exercise-variants">
              ${prog.bounces.variants.map(v => `<li>${v}</li>`).join('')}
            </ul>
          ` : ''}
          <div class="input-row">
            ${prog.bounces.track.map(t => `
              <div class="input-group">
                <span class="input-label">${t.label}</span>
                <input type="number" class="num-field bounce-field" placeholder="—"
                       value="${state.tracking[t.id] || ''}"
                       oninput="setTracking('${t.id}', this.value)" />
                ${t.unit ? `<span class="input-unit">${t.unit}</span>` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    ` : ''}

    <div class="section-label strength">Exercises</div>
    <div class="card">
      ${prog.exercises.map((ex, i) => `
        ${i > 0 ? '<hr class="card-divider">' : ''}
        <div class="exercise-block">
          <div class="exercise-header">
            <div class="exercise-letter">${ex.letter}</div>
            <div class="exercise-info">
              <div class="exercise-name">
                ${ex.name}
                ${ex.badge ? `<span class="superset-badge">${ex.badge}</span>` : ''}
              </div>
              <div class="exercise-rx">${ex.rx}</div>
            </div>
          </div>
          ${chunkPairs(ex.track).map(pair => `
          <div class="input-row">
            ${pair.map(t => `
              <div class="input-group">
                <span class="input-label">${t.label}</span>
                <input type="number" class="num-field" placeholder="—"
                       value="${state.tracking[t.id] || ''}"
                       oninput="setTracking('${t.id}', this.value)" />
                ${t.unit ? `<span class="input-unit">${t.unit}</span>` : ''}
              </div>
            `).join('')}
          </div>
          `).join('')}
        </div>
      `).join('')}
    </div>

    <div class="section-label emotion">Emotion Check-in</div>
    <div class="card">
      ${CONFIG.EMOTIONS.map(e => `
        <div class="metric-row">
          <div class="metric-name-wrap">
            <span class="metric-name">${e.name}</span>
            <span class="metric-desc">${e.desc}</span>
          </div>
          <div class="slider-wrap">
            <input type="range" min="1" max="5" step="1" value="${state.emotions[e.name]}"
                   class="emotion-slider"
                   oninput="setEmotion('${e.name}', this.value)" />
          </div>
          <span class="metric-value emotion-val">${state.emotions[e.name]}</span>
        </div>
      `).join('')}
    </div>

    <div class="section-label" style="color: var(--text-3)">Notes</div>
    <div class="card">
      <textarea class="notes-field" placeholder="Session notes, RPE, how it felt…"
                oninput="state.notes = this.value">${state.notes}</textarea>
    </div>

    <button class="submit-btn" onclick="submitSession()" ${state.submitting ? 'disabled' : ''}>
      ${state.submitting ? 'Saving…' : 'Log Session'}
    </button>

    <div class="section-label" style="color: var(--text-3); margin-top: 12px;">Trends</div>
    <div class="graph-container">
      <div class="graph-header">
        <span class="graph-title">Progress</span>
        <div class="graph-toggle">
          <button class="${state.graphMode === 'emotions' ? 'active' : ''}" onclick="setGraphMode('emotions')">Emotions</button>
          <button class="${state.graphMode === 'strength' ? 'active' : ''}" onclick="setGraphMode('strength')">Loads</button>
        </div>
      </div>
      <div class="graph-legend" id="legend"></div>
      <div class="graph-canvas-wrap">
        ${state.history.length < 2 ? '<div class="empty-graph">Log at least 2 sessions to see trends</div>' : '<canvas id="trendChart"></canvas>'}
      </div>
    </div>
  `;
}

function renderDiaryView() {
  const entries = state.allHistory.slice().reverse();
  if (entries.length === 0) {
    return '<div class="diary-empty" style="padding: 40px 0;">No sessions logged yet</div>';
  }
  return entries.map(entry => renderDiaryEntry(entry)).filter(h => h).join('');
}

// ════════════════════════════════════════════════════════════════
// ACTIONS
// ════════════════════════════════════════════════════════════════

function setTab(i) {
  state.activeTab = i;
  state.tracking = {};
  if (isDiary()) {
    loadAllHistory();
  } else {
    loadHistory();
  }
  render();
}

function setEmotion(name, val) {
  state.emotions[name] = parseInt(val);
  render();
}

function setTracking(id, val) {
  state.tracking[id] = val;
}

function setGraphMode(m) {
  state.graphMode = m;
  render();
}

async function submitSession() {
  if (state.submitting) return;
  state.submitting = true;
  render();
  showStatus('Saving session…', 'loading');

  const payload = {
    action: 'log',
    date: new Date().toISOString().split('T')[0],
    session: CONFIG.SESSIONS[state.activeTab],
    client: CONFIG.CLIENT_NAME,
    emotions: state.emotions,
    strength: state.tracking,
    notes: state.notes,
  };

  try {
    await fetch(state.scriptUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload),
    });
    showStatus('Session logged ✓', 'success');
    state.emotions = CONFIG.EMOTIONS.reduce((o, e) => ({ ...o, [e.name]: 3 }), {});
    state.tracking = {};
    state.notes = '';
    state.date = new Date().toISOString().split('T')[0];
    setTimeout(() => loadHistory(), 2000);
  } catch (err) {
    showStatus('Error saving — check your connection', 'error');
    console.error(err);
  }
  state.submitting = false;
  render();
}

async function loadHistory() {
  if (!state.scriptUrl) return;
  try {
    const url = `${state.scriptUrl}?action=history&client=${encodeURIComponent(CONFIG.CLIENT_NAME)}&session=${encodeURIComponent(CONFIG.SESSIONS[state.activeTab])}`;
    const resp = await fetch(url);
    const data = await resp.json();
    if (data && data.rows) {
      state.history = data.rows;
      render();
    }
  } catch (err) {
    console.log('Could not load history:', err.message);
  }
}

async function loadAllHistory() {
  if (!state.scriptUrl) return;
  try {
    const url = `${state.scriptUrl}?action=history&client=${encodeURIComponent(CONFIG.CLIENT_NAME)}`;
    const resp = await fetch(url);
    const data = await resp.json();
    if (data && data.rows) {
      state.allHistory = data.rows;
      render();
    }
  } catch (err) {
    console.log('Could not load history:', err.message);
  }
}

// ════════════════════════════════════════════════════════════════
// CHART
// ════════════════════════════════════════════════════════════════

const PALETTE = ['#E8845C', '#EFD06C', '#6C8EEF', '#CB6CEF', '#5CCFB5', '#EF6C6C', '#8BD4A0'];

function renderLegend() {
  const el = document.getElementById('legend');
  if (!el) return;
  let items, colors;
  if (state.graphMode === 'emotions') {
    items = CONFIG.EMOTIONS.map(e => e.name);
  } else {
    items = getLoadMetrics(CONFIG.SESSIONS[state.activeTab]).map(m => m.name);
  }
  el.innerHTML = items.map((name, i) => `
    <span class="legend-item">
      <span class="legend-dot" style="background:${PALETTE[i % PALETTE.length]}"></span>
      ${name}
    </span>
  `).join('');
}

function drawChart() {
  const canvas = document.getElementById('trendChart');
  if (!canvas || state.history.length < 2) return;

  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.scale(dpr, dpr);

  const W = rect.width, H = rect.height;
  const PAD = { top: 12, right: 12, bottom: 28, left: 32 };
  const plotW = W - PAD.left - PAD.right;
  const plotH = H - PAD.top - PAD.bottom;
  const rows = state.history.slice(-20);
  const n = rows.length;

  if (state.graphMode === 'emotions') {
    CONFIG.EMOTIONS.forEach((emo, ei) => {
      const values = rows.map(r => r.emotions ? (r.emotions[emo.name] || 3) : 3);
      drawLine(ctx, values, n, PAD, plotW, plotH, 1, 5, PALETTE[ei % PALETTE.length]);
    });
    drawAxes(ctx, rows, PAD, plotW, plotH, 1, 5, W, H);
  } else {
    const loadMetrics = getLoadMetrics(CONFIG.SESSIONS[state.activeTab]);
    let allVals = [];
    loadMetrics.forEach(m => {
      rows.forEach(r => {
        const v = r.strength ? parseFloat(r.strength[m.id]) : NaN;
        if (!isNaN(v)) allVals.push(v);
      });
    });
    const yMin = allVals.length ? Math.max(0, Math.min(...allVals) - 10) : 0;
    const yMax = allVals.length ? Math.max(...allVals) + 10 : 100;

    loadMetrics.forEach((m, mi) => {
      const values = rows.map(r => {
        const v = r.strength ? parseFloat(r.strength[m.id]) : NaN;
        return isNaN(v) ? null : v;
      });
      drawLine(ctx, values, n, PAD, plotW, plotH, yMin, yMax, PALETTE[mi % PALETTE.length]);
    });
    drawAxes(ctx, rows, PAD, plotW, plotH, yMin, yMax, W, H);
  }
}

function drawLine(ctx, values, n, PAD, plotW, plotH, yMin, yMax, color) {
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  let started = false;
  values.forEach((v, i) => {
    if (v === null || v === undefined) return;
    const x = PAD.left + (i / (n - 1)) * plotW;
    const y = PAD.top + plotH - ((v - yMin) / (yMax - yMin)) * plotH;
    if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
  });
  ctx.stroke();
  values.forEach((v, i) => {
    if (v === null || v === undefined) return;
    const x = PAD.left + (i / (n - 1)) * plotW;
    const y = PAD.top + plotH - ((v - yMin) / (yMax - yMin)) * plotH;
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  });
}

function drawAxes(ctx, rows, PAD, plotW, plotH, yMin, yMax, W, H) {
  ctx.strokeStyle = '#2A2D3A';
  ctx.lineWidth = 1;
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const y = PAD.top + (i / steps) * plotH;
    ctx.beginPath();
    ctx.moveTo(PAD.left, y);
    ctx.lineTo(PAD.left + plotW, y);
    ctx.stroke();
    const val = yMax - (i / steps) * (yMax - yMin);
    ctx.fillStyle = '#5D6175';
    ctx.font = '10px DM Sans';
    ctx.textAlign = 'right';
    ctx.fillText(Number.isInteger(val) ? val : val.toFixed(0), PAD.left - 6, y + 3);
  }
  ctx.fillStyle = '#5D6175';
  ctx.font = '10px DM Sans';
  ctx.textAlign = 'center';
  const fmt = d => { try { return new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short' }); } catch { return d; } };
  if (rows.length) {
    ctx.fillText(fmt(rows[0].date), PAD.left, H - 4);
    if (rows.length > 2) {
      const mid = Math.floor(rows.length / 2);
      ctx.fillText(fmt(rows[mid].date), PAD.left + (mid / (rows.length - 1)) * plotW, H - 4);
    }
    ctx.fillText(fmt(rows[rows.length - 1].date), PAD.left + plotW, H - 4);
  }
}

// ════════════════════════════════════════════════════════════════
// STATUS
// ════════════════════════════════════════════════════════════════

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status-bar ' + type + ' show';
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════

render();
loadHistory();
</script>
